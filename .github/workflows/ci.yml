name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOENV: "off"
      GOTOOLCHAIN: "local"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify preferred toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.27.1"

      - name: Verify module cache
        run: go mod verify

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Deadcode
        run: |
          output_file=$(mktemp)
          go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./... > "$output_file"
          if [ -s "$output_file" ]; then
            cat "$output_file"
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: |
          mkdir -p bin
          go build -trimpath -o bin/imsgcrawl ./cmd/imsgcrawl

  minimum:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOENV: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup minimum Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Verify minimum toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.27.0"

      - name: Verify minimum modules
        run: |
          go mod tidy -diff
          go mod verify

      - name: Build with minimum Go
        run: go build -p=1 ./...

      - name: Test with minimum Go
        run: go test -count=1 -p=1 -timeout=120s ./...

  vulnerabilities:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      GOWORK: "off"
      GOENV: "off"
      GOTOOLCHAIN: "local"
      GOMAXPROCS: "2"
      GOFLAGS: "-mod=readonly -p=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup preferred Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify structured scan evaluator
        run: python3 .github/scripts/test_vulncheck.py

      - name: Stage public modules, scanner and frozen advisories
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.27.1"
          go mod download
          scanner_version=$(python3 .github/scripts/vulncheck.py scanner-version)
          GOBIN="$RUNNER_TEMP/vulntools" go install "golang.org/x/vuln/cmd/govulncheck@$scanner_version"
          python3 .github/scripts/vulncheck.py stage "$RUNNER_TEMP/vulndb"

      - name: Scan preferred native configuration
        id: preferred
        continue-on-error: true
        run: python3 .github/scripts/vulncheck.py scan "$RUNNER_TEMP/vulndb" "$RUNNER_TEMP/vulntools/govulncheck" "$RUNNER_TEMP/vuln-preferred" go1.27.1 darwin

      - name: Setup minimum Go for separate advisory qualification
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Scan minimum native configuration
        id: minimum
        continue-on-error: true
        run: python3 .github/scripts/vulncheck.py scan "$RUNNER_TEMP/vulndb" "$RUNNER_TEMP/vulntools/govulncheck" "$RUNNER_TEMP/vuln-minimum" go1.27.0 darwin

      - name: Retain complete advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-vulnerability-evidence
          path: |
            ${{ runner.temp }}/vulndb
            ${{ runner.temp }}/vuln-preferred
            ${{ runner.temp }}/vuln-minimum
          if-no-files-found: error

      - name: Require both complete structured scans
        if: always()
        env:
          PREFERRED_OUTCOME: ${{ steps.preferred.outcome }}
          MINIMUM_OUTCOME: ${{ steps.minimum.outcome }}
        run: |
          test "$PREFERRED_OUTCOME" = success
          test "$MINIMUM_OUTCOME" = success
